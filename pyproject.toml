[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt_manager"
version = "0.1.0"
description = "A small simple prompt manager for LLM prompts"
authors = [
    { name="Daniel Winterstein", email="daniel.winterstein@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.6"

[project.urls]
homepage = "https://github.com/winterstein/prompt_manager"
repository = "https://github.com/winterstein/prompt_manager"

[project.dependencies]
# None

[project.optional-dependencies]
# None

[project.scripts]
# None

[project.classifiers]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
where = ["."]
